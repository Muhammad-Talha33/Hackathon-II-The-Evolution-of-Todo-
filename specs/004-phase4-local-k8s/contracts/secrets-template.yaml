# Secrets Template for Local Deployment
# This file provides examples and templates for managing secrets

## Kubernetes Secrets (Manual Creation)

### Option 1: Create Backend Secrets via kubectl

```bash
# Create secrets from literals
kubectl create secret generic todo-backend-secrets \
  --from-literal=OPENAI_API_KEY='sk-your-openai-api-key-here' \
  --from-literal=DATABASE_URL='postgresql://user:password@host:5432/dbname' \
  --from-literal=SECRET_KEY='your-jwt-secret-key-here' \
  --from-literal=REFRESH_TOKEN_EXPIRE_DAYS='7' \
  --from-literal=ACCESS_TOKEN_EXPIRE_MINUTES='60'

# Verify secrets created (values will be base64 encoded)
kubectl get secret todo-backend-secrets -o yaml

# View decoded secret (for debugging only!)
kubectl get secret todo-backend-secrets -o jsonpath='{.data.OPENAI_API_KEY}' | base64 --decode
```

### Option 2: Create Secrets from File

Create a file `backend-secrets.env` (DO NOT COMMIT):
```bash
OPENAI_API_KEY=sk-your-openai-api-key-here
DATABASE_URL=postgresql://user:password@host:5432/dbname
SECRET_KEY=your-jwt-secret-key-here
REFRESH_TOKEN_EXPIRE_DAYS=7
ACCESS_TOKEN_EXPIRE_MINUTES=60
```

Then create secret:
```bash
kubectl create secret generic todo-backend-secrets --from-env-file=backend-secrets.env

# Delete the file after creation (security)
rm backend-secrets.env
```

### Option 3: Create Secrets via YAML (base64 encoded)

Create `backend-secrets.yaml` (DO NOT COMMIT):
```yaml
apiVersion: v1
kind: Secret
metadata:
  name: todo-backend-secrets
type: Opaque
data:
  # Values below are base64 encoded
  # Example: echo -n 'your-secret' | base64
  OPENAI_API_KEY: c2stZXhhbXBsZS1rZXktaGVyZQ==  # Replace with your base64-encoded key
  DATABASE_URL: cG9zdGdyZXNxbDovL2V4YW1wbGU=     # Replace with your base64-encoded URL
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWhlcmU=       # Replace with your base64-encoded key
  REFRESH_TOKEN_EXPIRE_DAYS: Nw==                # "7" in base64
  ACCESS_TOKEN_EXPIRE_MINUTES: NjA=              # "60" in base64
```

Apply:
```bash
kubectl apply -f backend-secrets.yaml

# Delete the file after creation
rm backend-secrets.yaml
```

