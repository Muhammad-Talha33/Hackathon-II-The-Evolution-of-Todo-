## Troubleshooting

### Check if Secrets are Loaded

```bash
# List secrets
kubectl get secrets

# Describe secret (shows keys but not values)
kubectl describe secret todo-backend-secrets

# View secret YAML (values are base64 encoded)
kubectl get secret todo-backend-secrets -o yaml

# Check if pod has secret mounted
kubectl get pod <backend-pod-name> -o jsonpath='{.spec.containers[0].envFrom}'

# Exec into pod and check env vars (DEBUGGING ONLY)
kubectl exec -it <backend-pod-name> -- env | grep OPENAI_API_KEY
```

### Delete and Recreate Secrets

```bash
# Delete secret
kubectl delete secret todo-backend-secrets

# Recreate with new values
kubectl create secret generic todo-backend-secrets --from-literal=...

# Restart pods to pick up new secret
kubectl rollout restart deployment todo-backend
```

---

**Important**: Never commit actual secrets to version control. Always use:
- `.gitignore` to exclude secret files
- `values-local.yaml` (gitignored) for Helm secrets
- `.env` (gitignored) for Docker Compose secrets
- `.env.example` (committed) as a template for users
