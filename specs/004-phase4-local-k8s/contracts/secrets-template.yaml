## Helm Installation Examples

### Install Backend with Secrets

```bash
# Option 1: Using values-local.yaml
helm install todo-backend ./helm/backend \
  -f helm/backend/values-local.yaml

# Option 2: Using --set flags
helm install todo-backend ./helm/backend \
  --set secrets.openaiApiKey='sk-...' \
  --set secrets.databaseUrl='postgresql://...' \
  --set secrets.secretKey='...'

# Option 3: Pre-create secrets, install chart without secrets
kubectl create secret generic todo-backend-secrets --from-env-file=backend-secrets.env
helm install todo-backend ./helm/backend \
  --set secrets.createSecret=false  # If chart supports this flag
```

### Install Frontend

```bash
# Frontend has no secrets, can use default values
helm install todo-frontend ./helm/frontend

# Or with custom values
helm install todo-frontend ./helm/frontend \
  -f helm/frontend/values-local.yaml
```

