## Security Best Practices

### Generate Strong Secrets

```bash
# Generate JWT secret key
openssl rand -hex 32

# Generate random password
openssl rand -base64 24

# Generate UUID
python -c "import uuid; print(uuid.uuid4())"
```

### Base64 Encoding for Kubernetes

```bash
# Encode a secret
echo -n 'your-secret-value' | base64

# Decode a secret (for verification)
echo 'eW91ci1zZWNyZXQtdmFsdWU=' | base64 --decode
```

### .gitignore Entries (REQUIRED)

Add to `.gitignore`:
```gitignore
# Environment files
.env
.env.local
*.env.local

# Helm values with secrets
values-local.yaml
values-*.local.yaml
**/values-local.yaml

# Kubernetes secrets
*-secrets.yaml
*-secrets.env
backend-secrets.*
frontend-secrets.*

# Temporary secret files
*.secret
secrets/
```

