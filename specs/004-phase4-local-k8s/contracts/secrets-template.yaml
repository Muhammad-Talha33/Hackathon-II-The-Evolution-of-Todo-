## Helm Values (values-local.yaml)

### Backend values-local.yaml (DO NOT COMMIT)

Create `helm/backend/values-local.yaml`:
```yaml
# Override secrets for local deployment
# This file should be in .gitignore

secrets:
  openaiApiKey: "sk-your-openai-api-key-here"
  databaseUrl: "postgresql://user:password@host:5432/dbname"
  secretKey: "your-jwt-secret-key-here"  # Generate with: openssl rand -hex 32
  refreshTokenExpireDays: "7"
  accessTokenExpireMinutes: "60"

# Override config if needed
config:
  corsOrigins: "http://localhost:30080,http://localhost:3000"
  environment: "development"
  logLevel: "DEBUG"

# Override resources for local testing
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"
```

Install with custom values:
```bash
helm install todo-backend ./helm/backend -f helm/backend/values-local.yaml
```

### Frontend values-local.yaml (Optional - no secrets)

Create `helm/frontend/values-local.yaml`:
```yaml
# Override frontend config for local deployment

config:
  # For kind/Minikube, use in-cluster DNS
  apiUrl: "http://todo-backend:8000"

  # For Docker Compose or host access, use localhost
  # apiUrl: "http://localhost:8000"

  nodeEnv: "development"

# Override service for local access
service:
  type: NodePort
  nodePort: 30080  # Access at http://localhost:30080
```

