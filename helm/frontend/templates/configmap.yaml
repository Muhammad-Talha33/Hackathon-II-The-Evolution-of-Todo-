apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.configMapName" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # Backend API URL - uses in-cluster DNS by default
  NEXT_PUBLIC_API_URL: {{ .Values.config.apiUrl | quote }}

  # Node environment
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
