apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OpenAI API Key
  OPENAI_API_KEY: {{ required "secrets.openaiApiKey is required!" .Values.secrets.openaiApiKey | quote }}

  # Database Connection
  DATABASE_URL: {{ required "secrets.databaseUrl is required!" .Values.secrets.databaseUrl | quote }}

  # JWT Secret Key
  SECRET_KEY: {{ required "secrets.secretKey is required!" .Values.secrets.secretKey | quote }}

  # Token Expiration Settings
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.secrets.refreshTokenExpireDays | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.secrets.accessTokenExpireMinutes | quote }}
