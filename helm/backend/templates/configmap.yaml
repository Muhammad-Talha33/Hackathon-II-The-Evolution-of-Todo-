apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.configMapName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  # CORS Configuration
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}

  # Environment
  ENVIRONMENT: {{ .Values.config.environment | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
