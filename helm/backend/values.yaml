# Default values for todo-backend Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ==============================================================================
# Replica Configuration
# ==============================================================================
replicaCount: 1  # Number of backend pods (1 for local, 2+ for production)

# ==============================================================================
# Image Configuration
# ==============================================================================
image:
  repository: todo-backend  # Image name (without tag)
  tag: latest              # Image tag (use semantic versioning in production)
  pullPolicy: IfNotPresent # Kubernetes image pull policy (IfNotPresent, Always, Never)

# ==============================================================================
# Service Configuration
# ==============================================================================
service:
  type: ClusterIP          # Service type (ClusterIP for internal-only access)
  port: 8000               # Service port
  targetPort: 8000         # Container port
  annotations: {}          # Optional service annotations

# ==============================================================================
# Resource Limits and Requests
# ==============================================================================
resources:
  requests:
    memory: "256Mi"        # Minimum memory allocation
    cpu: "250m"            # Minimum CPU allocation (0.25 cores)
  limits:
    memory: "512Mi"        # Maximum memory allocation
    cpu: "500m"            # Maximum CPU allocation (0.5 cores)

# ==============================================================================
# Health Check Configuration
# ==============================================================================
livenessProbe:
  httpGet:
    path: /health          # Health check endpoint
    port: 8000
  initialDelaySeconds: 15  # Wait before first probe
  periodSeconds: 20        # Interval between probes
  timeoutSeconds: 5        # Probe timeout
  failureThreshold: 3      # Failures before pod restart

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ==============================================================================
# Secrets (REQUIRED - must be overridden)
# ==============================================================================
# WARNING: NEVER commit actual secret values to version control!
# Use one of these methods to provide secrets:
#   1. Create values-local.yaml (gitignored) with actual values
#   2. Use --set flags: helm install ... --set secrets.openaiApiKey=sk-...
#   3. Use Kubernetes external secrets operator in production
secrets:
  openaiApiKey: ""         # REQUIRED: OpenAI API key (sk-...)
  databaseUrl: ""          # REQUIRED: Neon PostgreSQL URL (postgresql://...)
  secretKey: ""            # REQUIRED: JWT signing secret (generate with: openssl rand -hex 32)
  refreshTokenExpireDays: "7"          # Token expiration in days
  accessTokenExpireMinutes: "60"      # Access token TTL in minutes

# ==============================================================================
# Non-Sensitive Configuration
# ==============================================================================
config:
  corsOrigins: "http://localhost:30080,http://todo-frontend:3000"  # Allowed CORS origins
  environment: "development"  # Deployment environment (development/staging/production)
  logLevel: "INFO"           # Logging level (DEBUG, INFO, WARNING, ERROR)

# ==============================================================================
# Deployment Strategy
# ==============================================================================
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1              # Max extra pods during update
    maxUnavailable: 0        # Min pods available during update (zero-downtime)

# ==============================================================================
# Node Selector (Optional)
# ==============================================================================
# Example: Schedule pods on specific nodes
# nodeSelector:
#   disktype: ssd
nodeSelector: {}

# ==============================================================================
# Tolerations (Optional)
# ==============================================================================
# Example: Allow pods to run on tainted nodes
# tolerations:
#   - key: "key1"
#     operator: "Equal"
#     value: "value1"
#     effect: "NoSchedule"
tolerations: []

# ==============================================================================
# Affinity Rules (Optional)
# ==============================================================================
# Example: Co-locate with frontend or spread across zones
# affinity:
#   podAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       - labelSelector:
#           matchExpressions:
#             - key: app
#               operator: In
#               values:
#                 - todo-frontend
#         topologyKey: kubernetes.io/hostname
affinity: {}

# ==============================================================================
# Pod Annotations (Optional)
# ==============================================================================
# Example: Add custom annotations for monitoring, logging, etc.
# podAnnotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8000"
podAnnotations: {}

# ==============================================================================
# Security Context (Optional)
# ==============================================================================
# Uncomment if using non-root user in Dockerfile
securityContext:
  runAsNonRoot: true   # Backend Dockerfile creates appuser (uid 1000)
  runAsUser: 1000
  fsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # Set to true if application doesn't write to disk

# ==============================================================================
# Service Account (Optional)
# ==============================================================================
# Create a service account for pod identity
serviceAccount:
  create: true
  annotations: {}
  name: ""  # If blank, will use chart fullname

# ==============================================================================
# Autoscaling (Optional - for production)
# ==============================================================================
# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 10
#   targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80

