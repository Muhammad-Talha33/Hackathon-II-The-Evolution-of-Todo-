# T013: Reminder worker service - ClusterIP on port 8001
apiVersion: v1
kind: Service
metadata:
  name: reminder-worker
  labels:
    app: reminder-worker
    app.kubernetes.io/name: reminder-worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app: reminder-worker
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
