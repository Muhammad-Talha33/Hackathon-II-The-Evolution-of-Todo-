# T019: Dapr configuration with Zipkin tracing and metrics
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  labels:
    app.kubernetes.io/part-of: todo-system
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false
