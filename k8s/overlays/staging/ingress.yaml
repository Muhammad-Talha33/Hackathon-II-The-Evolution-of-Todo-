# Staging ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-staging-ingress
  namespace: todo-staging
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API routes - strip /api prefix when forwarding to backend
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # All other routes go to frontend (including /_next, /auth, etc)
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 3000
