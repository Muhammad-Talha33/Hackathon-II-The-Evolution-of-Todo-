# T058: CD Production workflow - manual trigger with environment protection
name: CD Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (SHA or version)'
        required: true
        type: string
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate image exists
        run: |
          # Check if the image tag exists in GHCR
          for image in backend frontend reminder-worker recurrence-worker; do
            echo "Checking $image:${{ inputs.image_tag }}"
            docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$image:${{ inputs.image_tag }} > /dev/null 2>&1 || {
              echo "❌ Image not found: $image:${{ inputs.image_tag }}"
              exit 1
            }
            echo "✅ $image:${{ inputs.image_tag }} exists"
          done

      - name: Validate Kustomize build
        run: |
          kustomize build k8s/overlays/production > /dev/null
          echo "✅ Kustomize build successful"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config

      - name: Backup current deployment
        run: |
          kubectl get deployment -n todo-production -o yaml > deployment-backup.yaml || true
          echo "Current deployment backed up"

      - name: Update image tags
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            ghcr.io/todo-app/backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ inputs.image_tag }} \
            ghcr.io/todo-app/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ inputs.image_tag }} \
            ghcr.io/todo-app/reminder-worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/reminder-worker:${{ inputs.image_tag }} \
            ghcr.io/todo-app/recurrence-worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/recurrence-worker:${{ inputs.image_tag }}

      - name: Deploy to production
        run: |
          kubectl apply -k k8s/overlays/production

          echo "Waiting for backend rollout..."
          kubectl rollout status deployment/backend -n todo-production --timeout=600s

          echo "Waiting for frontend rollout..."
          kubectl rollout status deployment/frontend -n todo-production --timeout=600s

          echo "Waiting for reminder-worker rollout..."
          kubectl rollout status deployment/reminder-worker -n todo-production --timeout=600s

          echo "Waiting for recurrence-worker rollout..."
          kubectl rollout status deployment/recurrence-worker -n todo-production --timeout=600s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n todo-production
          echo ""
          echo "=== Services ==="
          kubectl get services -n todo-production
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n todo-production
          echo ""
          echo "=== Dapr Components ==="
          kubectl get components.dapr.io -n todo-production

      - name: Run production health checks
        if: ${{ !inputs.skip_tests }}
        run: |
          # Wait for ingress to propagate
          sleep 60

          # Get ingress host
          INGRESS_HOST=$(kubectl get ingress todo-ingress -n todo-production -o jsonpath='{.spec.rules[0].host}')

          echo "Testing health endpoint at $INGRESS_HOST..."

          # Health check with retries
          for i in {1..5}; do
            if curl -sf "https://$INGRESS_HOST/health" > /dev/null 2>&1; then
              echo "✅ Health check passed"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Image tag: ${{ inputs.image_tag }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config

      - name: Rollback deployments
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."

          kubectl rollout undo deployment/backend -n todo-production
          kubectl rollout undo deployment/frontend -n todo-production
          kubectl rollout undo deployment/reminder-worker -n todo-production
          kubectl rollout undo deployment/recurrence-worker -n todo-production

          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/backend -n todo-production --timeout=300s
          kubectl rollout status deployment/frontend -n todo-production --timeout=300s

      - name: Notify on rollback
        run: |
          echo "🔄 Production rollback completed!"
          echo "Failed image tag: ${{ inputs.image_tag }}"
          echo "Please investigate the deployment failure."
