# T056: CD Staging workflow - triggered on CI success
name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Update image tags
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/todo-app/backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.event.workflow_run.head_sha }} \
            ghcr.io/todo-app/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.event.workflow_run.head_sha }} \
            ghcr.io/todo-app/reminder-worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/reminder-worker:${{ github.event.workflow_run.head_sha }} \
            ghcr.io/todo-app/recurrence-worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/recurrence-worker:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging
        run: |
          kubectl apply -k k8s/overlays/staging
          kubectl rollout status deployment/backend -n todo-staging --timeout=300s
          kubectl rollout status deployment/frontend -n todo-staging --timeout=300s
          kubectl rollout status deployment/reminder-worker -n todo-staging --timeout=300s
          kubectl rollout status deployment/recurrence-worker -n todo-staging --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n todo-staging
          echo ""
          echo "=== Services ==="
          kubectl get services -n todo-staging
          echo ""
          echo "=== Dapr Components ==="
          kubectl get components.dapr.io -n todo-staging

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30

          # Get backend service URL
          BACKEND_URL=$(kubectl get svc backend -n todo-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):8000

          # Health check
          curl -sf http://$BACKEND_URL/health || echo "Health check endpoint not accessible via LoadBalancer - using internal routing"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
